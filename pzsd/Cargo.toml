[package]
name = "pzsd"
version = "0.1.0"
edition = "2021"

[dependencies]
eyre = "0.6.12"
gio = "0.20.1"
gstreamer-app = "0.23.0"
gtk4 = "0.9.0"
gtk4-layer-shell = "0.4.0"
itertools = "0.13.0"
nix = { version = "0.29.0", features = ["process"] }
notify = { version = "7.0.0", default-features = false }
once_cell = "1.20.2"
relm4 = { version = "0.9.1", features = ["gnome_47"] }
rust-ini = "0.21.1"
tokio = { version = "1.39.3", features = ["full"] }
tracing = "0.1.40"
walkdir = "2.5.0"
xdg = "2.5.2"
zbus = { git = "https://github.com/dbus2/zbus.git", rev = "46fc45c67e7f9718ab0f41364b16cec9719c6528", features = ["tokio"], default-features = false }

[[bin]]
name = "pzsd"
path = "src/init.rs"
